<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindonibus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: rgb(8, 173, 101);
            color: white;
        }
        .opcao{
            cursor: pointer;
            background-color: rgb(25, 135, 84);
            width: 180px;

        }
        article{
            display: flex;
        }
        li{
            font-size: 1rem;
            list-style: none;
        }
    </style>
</head>
<body>
    <nav>

    <main>
        <section class="mx-auto p-2" style="width: 300px;">
            <h2>Seja bem-vindo(a)</h2>
        </section>
        <section class="m-5 container">
            <h2>Cartão de transposte</h2>
            <article class="d-flex gap-2 flex-wrap">
            <!--<article class="row row-cols-2 row-cols-lg-5 g-2 g-lg-3 ">-->
                <div class="opcao p-2 text-center rounded">
                    <h4 class="p-3">Comprar crédito</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4 class="p-3">Novo cartão transporte</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4 class="p-3">Meus cartões</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4 class="p-3">Consultar recargas</h4>
                </div>
                <div class="opcao p-2 text-center rounded">

                </div>

        <section class="m-5 container">

                    <h4>Comprar Crédito</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4>Gerar</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4>Consultar Saldo</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4>Consultar utilizações</h4>
                </div>
                <div class="opcao p-2 text-center rounded">
                    <h4>Últimas compras</h4>
                </div>
            </article>
        </section>
    </main>
    <footer class="fixed-bottom bg-success">
        <ul class="d-flex justify-content-between">
            <li>Home</li>
            <li>Meus cartões</li>
            <li>Comprar crédito</li>
            <li>Perfil</li>
        </ul>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
